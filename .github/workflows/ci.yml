name: E2E tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # segunda-feira, 9h (horário de Brasília)
    - cron: '0 12 * * 1'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Testes (Chrome headless)
        run: mvn -B test -Dbrowser=chrome-ci

      - name: Relatório do Cucumber
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cucumber-report
          path: target/reports/
          if-no-files-found: ignore
